name: Smoke Tests (Docker Compose)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read
  checks: write
  packages: write
  pull-requests: write

jobs:
  smoke_tests:
    uses: ianoflynnautomation/bjjeire-tests/.github/workflows/playwright-docker.yml@main
    with:
      compose_files: |
        docker-compose.yml
        docker-compose.override.local.yml
        docker-compose.override.ci.yml
      compose_pre_up_script: .github/scripts/smoke-pre-up.sh
      seed_data: true
      compose_health_url: http://localhost:5003/health
      base_url: http://localhost:3000
      api_base_url: http://localhost:5003
      test_tags: '@smoke'
      playwright_projects: '["api","chromium-desktop"]'
      test_repo: ianoflynnautomation/bjjeire-tests
    secrets: inherit
