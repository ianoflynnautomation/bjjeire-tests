name: Smoke Tests (Docker Compose)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read
  checks: write
  packages: write
  pull-requests: write

jobs:
  smoke_tests:
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/playwright-docker-tests.yml@main
    with:
      compose-files: |
        docker-compose.yml
        docker-compose.override.local.yml
        docker-compose.override.ci.yml
      compose-pre-up-script: .github/scripts/smoke-pre-up.sh
      seed-command: docker compose run --rm seeder
      compose-health-url: http://localhost:5003/health
      base-url: http://localhost:3000
      api-url: http://localhost:5003
      test-tags: '@smoke'
      playwright-projects: |
        api
        chromium-desktop
      project-shard-overrides: |
        api=1
        chromium-desktop=2
      test-repo: ianoflynnautomation/bjjeire-tests
      fail-on-flaky: true
    secrets: inherit
