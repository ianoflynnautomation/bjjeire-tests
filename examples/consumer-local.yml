name: E2E (existing environment)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read
  checks: write

jobs:
  e2e:
    uses: ianoflynnautomation/bjjeire-tests/.github/workflows/playwright-tests.yml@main
    with:
      app_env: staging
      base_url: https://staging.example.com
      api_base_url: https://api.staging.example.com
      test_tags: '@acceptance'
      shard_total: 6
      playwright_projects: '["api","chromium-desktop","firefox-desktop","webkit-desktop","chromium-wide","snapshots","a11y","mobile-iphone","mobile-galaxy"]'
      test_repo: ianoflynnautomation/bjjeire-tests
    secrets: inherit
