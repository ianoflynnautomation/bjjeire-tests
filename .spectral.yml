extends:
  - 'spectral:oas'

rules:
  # Require operationId on every operation
  operation-operationId: error

  # Warn on missing descriptions
  operation-description: warn
  info-description: warn

  # Warn on missing schema examples
  oas3-valid-schema-example: warn

  # Error on invalid media type
  oas3-valid-media-example: error

  # Ensure all responses have descriptions
  operation-success-response: error

  # Disable overly strict rules for this project
  info-contact: off
  info-license: off
  oas3-api-servers: off
