apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.envId }}
  labels:
    gateway-access: "true"
    istio-injection: enabled
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    bjjeire.io/ephemeral: "true"
    bjjeire.io/env-id: {{ .Values.envId | quote }}
  annotations:
    janitor/ttl: {{ .Values.ttl | quote }}
