# Static per-environment Helm values for the bjj-eire umbrella chart
# (oci://ghcr.io/ianoflynnautomation/bjj-eire).
#
# This file holds only the values that DON'T vary per environment. The
# per-env bits (namespace, image tags, hostnames) are layered on top by a
# generated overlay (-f rendered/values-dynamic.yaml) in env-deploy.yml —
# no more envsubst.
#
# Diffs from the production HelmRelease (gitops bjj-eire/app/helmrelease.yaml):
#   - Single replica, autoscaling disabled — ephemeral envs don't need redundancy
#   - MongoDB on ephemeral storage (emptyDir), no PVC — fast spin-up, no leak
#   - Smaller resource requests so multiple envs fit on the spot pool
#   - Frontend points at the in-env API service, not the prod one
#
# ⚠ Chart smell: every subchart's helpers do `lookup ... .Values.namespace`
# (defaults to "bjj-app") instead of using .Release.Namespace. Until the chart
# is fixed, every subchart that touches secrets must have namespace overridden —
# that override is supplied per-env via the dynamic overlay.
bjj-mongodb:
  mongodb:
    persistence:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
  secrets:
    mongodbRootPassword:
      enabled: true
      create: false
      name: bjj-mongodb-root-password
      key: mongodb-password

bjj-api:
  api:
    image:
      repository: ghcr.io/ianoflynnautomation/bjjeire-api
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr-pull-secret
    replicaCount: 1
    podAnnotations:
      prometheus.io/scrape: 'true'
      prometheus.io/path: '/metrics'
      prometheus.io/port: '80'
    env:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: 'http://+:80'
      ASPNETCORE_HTTP_PORT: '80'
      CorsOptions__AllowedMethods: 'GET,POST,PUT,DELETE'
      CorsOptions__AllowedHeaders: 'Authorization,Content-Type'
      ReadOnlyMode__Enabled: 'false'
      FeatureManagement__BjjEvents: 'true'
      FeatureManagement__Gyms: 'true'
      FeatureManagement__Stores: 'true'
      FeatureManagement__Competitions: 'true'
      ServiceDefaults__ServiceName: 'BjjEire.Api'
      ServiceDefaults__EnablePrometheus: 'true'
      AzureAd__Instance: 'https://login.microsoftonline.com/'
      Serilog__Properties__Application: 'BjjWorld.Api'
      OTEL_EXPORTER_OTLP_ENDPOINT: 'http://otel-collector.observability.svc.cluster.local:4317'
      OTEL_RESOURCE_ATTRIBUTES__service.name: 'BjjWorld.Api'
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    autoscaling:
      enabled: false
  secrets:
    mongodbRootPassword:
      enabled: true
      create: false
      name: bjj-mongodb-root-password
      key: mongodb-password
  kestrelCert:
    enabled: false
  ingress:
    enabled: false

bjj-frontend:
  frontend:
    image:
      repository: ghcr.io/ianoflynnautomation/bjjeire-frontend
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ghcr-pull-secret
    replicaCount: 1
    podAnnotations:
      prometheus.io/scrape: 'true'
      prometheus.io/path: '/metrics'
      prometheus.io/port: '80'
    env:
      NODE_ENV: production
      PORT: '80'
    resources:
      limits:
        cpu: 300m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
    autoscaling:
      enabled: false
    waitForApi:
      enabled: true
  ingress:
    enabled: false

seeder:
  enabled: true
  image:
    repository: ghcr.io/ianoflynnautomation/bjjeire-seeder
    pullPolicy: IfNotPresent
  hookPolicy: 'post-install,post-upgrade'
  mongodb:
    host: bjj-mongodb
    port: 27017
    user: admin
    database: Mongodb
    secretName: bjj-mongodb-root-password
    secretKey: mongodb-password
