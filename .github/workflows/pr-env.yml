# Reusable workflow: per-PR ephemeral environment (thin wrapper).
#
# Translates the PR-flavoured contract (pr_number) into the canonical
# env-deploy.yml call with env_id=pr-${PR_NUMBER}. Exists only so the BjjEire
# repo's existing pr_number-based caller keeps working — new callers should
# target env-deploy.yml directly.
#
# Full deploy → test → destroy pipeline (in BjjEire/.github/workflows/ci-main.yml):
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, closed]
#
#   jobs:
#     pr-env:
#       uses: ianoflynnautomation/bjjeire-tests/.github/workflows/pr-env.yml@main
#       with:
#         action: ${{ github.event.action == 'closed' && 'destroy' || 'deploy' }}
#         pr_number: ${{ github.event.pull_request.number }}
#         image_tag: ${{ github.event.pull_request.head.sha }}
#         cluster_resource_group: rg-aks-bjjeire-dev-sdc-01
#         cluster_name: aks-bjjeire-dev-sdc-01
#         cluster_domain: dev.bjjeire.io
#       secrets: inherit
#
#     pr-tests:
#       if: github.event.action != 'closed'
#       needs: [pr-env]
#       uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/playwright-tests.yml@v1
#       with:
#         app-env: staging
#         base-url: ${{ needs.pr-env.outputs.base_url }}
#         api-url: ${{ needs.pr-env.outputs.api_base_url }}
#         test-repo: ianoflynnautomation/bjjeire-tests
#         test-tags: "@smoke|@acceptance"
#         playwright-projects: |
#           api
#           chromium-desktop
#         runs-on: gha-runner-scale-set
#         # API shards skip the Cloudflare edge via in-cluster Service DNS.
#         project-env-overrides: |
#           api:API_URL=${{ needs.pr-env.outputs.internal_api_url }}
#           api:CF_ACCESS_CLIENT_ID=
#           api:CF_ACCESS_CLIENT_SECRET=
#       secrets:
#         test-env-vars: |
#           PW_TEST_USER=${{ secrets.PW_TEST_USER }}
#           PW_TEST_PASSWORD=${{ secrets.PW_TEST_PASSWORD }}

name: PR ephemeral environment

on:
  workflow_call:
    inputs:
      action:
        description: 'deploy | destroy'
        type: string
        required: true
      pr_number:
        description: 'GitHub PR number; used to derive env_id (env_id=pr-${pr_number}).'
        type: number
        required: true
      image_tag:
        description: 'Container tag for api/frontend/seeder (typically the PR head SHA).'
        type: string
        required: false
        default: ''
      cluster_resource_group:
        description: 'Azure RG containing the AKS cluster.'
        type: string
        required: true
      cluster_name:
        description: 'AKS cluster name.'
        type: string
        required: true
      cluster_domain:
        description: 'Per-cluster DNS suffix (e.g. dev.bjjeire.com). Kept for diagnostics — public hostnames use root_domain.'
        type: string
        required: true
      root_domain:
        description: >-
          DNS base for public hostnames. Empty (the default) = use cluster_domain, so PR
          envs nest under the environment: pr-${pr_number}.<cluster_domain>
          (e.g. pr-42.dev.bjjeire.com) and api-pr-${pr_number}.<cluster_domain>.
        type: string
        required: false
        default: ''
      chart_ref:
        description: 'OCI Helm chart reference for the umbrella chart.'
        type: string
        required: false
        default: 'oci://ghcr.io/ianoflynnautomation/bjj-eire'
      chart_version:
        description: 'Chart version constraint passed to helm --version.'
        type: string
        required: false
        default: '>=0.1.0'
      ttl:
        description: 'Janitor TTL annotation; safety net if the destroy step is skipped.'
        type: string
        required: false
        default: '2h'
      runner_label:
        description: 'Runner to schedule on. Defaults to the in-cluster ARC pool.'
        type: string
        required: false
        default: 'gha-runner-scale-set'

    secrets:
      AZURE_TENANT_ID:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      GHCR_TOKEN:
        required: false

    outputs:
      base_url:
        description: 'Public URL of the deployed frontend (https://pr-N.<domain>).'
        value: ${{ jobs.delegate.outputs.base_url }}
      api_base_url:
        description: 'Public URL of the deployed API.'
        value: ${{ jobs.delegate.outputs.api_base_url }}
      internal_api_url:
        description: 'In-cluster Service DNS URL of the deployed API. Pass to playwright-tests internal_api_url so API shards bypass the Cloudflare edge.'
        value: ${{ jobs.delegate.outputs.internal_api_url }}
      namespace:
        description: 'Kubernetes namespace the env was deployed into / removed from (pr-${pr_number}).'
        value: ${{ jobs.delegate.outputs.namespace }}

permissions:
  contents: read
  id-token: write

jobs:
  delegate:
    name: Delegate to env-deploy
    uses: ./.github/workflows/env-deploy.yml
    with:
      action: ${{ inputs.action }}
      # Hostnames become pr-${pr_number}.${root_domain} / api-pr-${pr_number}.${root_domain}.
      # Only the dev cluster runs PR envs in practice — if you ever spawn PR
      # envs from a second cluster against the same root_domain, add a cluster
      # discriminator here (e.g. pr-${pr_number}-staging) to avoid collisions.
      env_id: pr-${{ inputs.pr_number }}
      image_tag: ${{ inputs.image_tag }}
      cluster_resource_group: ${{ inputs.cluster_resource_group }}
      cluster_name: ${{ inputs.cluster_name }}
      cluster_domain: ${{ inputs.cluster_domain }}
      root_domain: ${{ inputs.root_domain }}
      chart_ref: ${{ inputs.chart_ref }}
      chart_version: ${{ inputs.chart_version }}
      ttl: ${{ inputs.ttl }}
      runner_label: ${{ inputs.runner_label }}
    secrets: inherit
