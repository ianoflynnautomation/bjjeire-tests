# Reusable workflow: ephemeral environment lifecycle (canonical primitive).
#
# Deploys the bjj-eire stack into an isolated namespace named by env_id, or
# destroys it. Designed to underpin three tiers:
#   - PR gate              → env_id=pr-${PR_NUMBER}        (see pr-env.yml wrapper)
#   - Pre-deploy gate      → env_id=staging-${SHA}
#   - Nightly regression   → env_id=regression
#
# Naming convention:
#   namespace      = ${env_id}
#   frontend host  = ${env_id}.${cluster_domain}
#   api host       = ${env_id}-api.${cluster_domain}
#   internal api   = http://bjj-api.${env_id}.svc.cluster.local
#
# Caller pattern (deploy then test, destroy on completion):
#
#   on:
#     push:
#       branches: [main]
#
#   jobs:
#     env_up:
#       uses: ianoflynnautomation/bjjeire-tests/.github/workflows/env-deploy.yml@main
#       with:
#         action: deploy
#         env_id: staging-${{ github.sha }}
#         image_tag: ${{ github.sha }}
#         cluster_resource_group: rg-aks-bjjeire-dev-sdc-01
#         cluster_name: aks-bjjeire-dev-sdc-01
#         cluster_domain: dev.bjjeire.io
#         ttl: 4h
#       secrets: inherit
#
#     acceptance:
#       needs: env_up
#       uses: ianoflynnautomation/bjjeire-tests/.github/workflows/playwright-tests.yml@main
#       with:
#         app_env: staging
#         base_url: ${{ needs.env_up.outputs.base_url }}
#         api_base_url: ${{ needs.env_up.outputs.api_base_url }}
#         internal_api_url: ${{ needs.env_up.outputs.internal_api_url }}
#         test_repo: ianoflynnautomation/bjjeire-tests
#         test_tags: "@acceptance"
#       secrets: inherit
#
#     env_down:
#       if: always() && needs.env_up.result == 'success'
#       needs: [env_up, acceptance]
#       uses: ianoflynnautomation/bjjeire-tests/.github/workflows/env-deploy.yml@main
#       with:
#         action: destroy
#         env_id: staging-${{ github.sha }}
#         cluster_resource_group: rg-aks-bjjeire-dev-sdc-01
#         cluster_name: aks-bjjeire-dev-sdc-01
#         cluster_domain: dev.bjjeire.io
#       secrets: inherit

name: Environment deploy

# Triggers:
#   - workflow_call: how the acceptance pipeline and pr-env wrapper invoke this.
#   - workflow_dispatch: escape hatch for manual ad-hoc env ops from the GHA
#     UI (or `gh workflow run`). Use cases:
#       * Provision a debug env from a specific SHA when artifacts aren't
#         enough to reproduce a failure: action=deploy, env_id=debug-<name>,
#         image_tag=<sha>.
#       * Tear down an env you no longer need: action=destroy, env_id=...
#       * Force-recreate after a botched run: action=destroy then action=deploy.
#     Auto-acceptance envs (env_id starting with `staging-`) are TTL-managed
#     and should be left alone here unless you genuinely need to intervene.
on:
  workflow_call:
    inputs:
      action:
        description: 'deploy | destroy'
        type: string
        required: true
      env_id:
        description: 'Environment identifier — also the namespace name. Must be DNS-safe (lowercase alphanumerics + hyphens, ≤63 chars). Examples: pr-42, staging-abc1234, regression.'
        type: string
        required: true
      image_tag:
        description: 'Container tag for api/frontend/seeder (typically the commit SHA).'
        type: string
        required: false
        default: ''
      cluster_resource_group:
        description: 'Azure RG containing the AKS cluster.'
        type: string
        required: true
      cluster_name:
        description: 'AKS cluster name.'
        type: string
        required: true
      cluster_domain:
        description: >-
          Per-cluster DNS suffix (e.g. dev.bjjeire.com). Used only for naming the
          cluster — public hostnames are composed from root_domain (single-level so
          they fall under the Universal SSL *.<root_domain> cert).
        type: string
        required: true
      root_domain:
        description: >-
          DNS base for public hostnames: <env_id>.<root_domain> (frontend) and
          api-<env_id>.<root_domain> (api). Empty (the default) = use cluster_domain,
          so ephemeral envs nest under the environment (e.g. pr-N.dev.bjjeire.com).
          Must be served by a *.<root_domain> gateway listener + SSL cert.
        type: string
        required: false
        default: ''
      chart_ref:
        description: 'OCI Helm chart reference for the umbrella chart.'
        type: string
        required: false
        default: 'oci://ghcr.io/ianoflynnautomation/bjj-eire'
      chart_version:
        description: 'Chart version constraint passed to helm --version.'
        type: string
        required: false
        default: '>=0.1.0'
      ttl:
        description: 'Janitor TTL annotation; safety net if the destroy step is skipped.'
        type: string
        required: false
        default: '2h'
      runner_label:
        description: 'Runner to schedule on. Defaults to the in-cluster ARC pool — required for kubectl to reach the API server when the cluster is private.'
        type: string
        required: false
        default: 'gha-runner-scale-set'

    secrets:
      AZURE_TENANT_ID:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      GHCR_TOKEN:
        required: false

    outputs:
      base_url:
        description: 'Public URL of the deployed frontend (https://${env_id}.<domain>).'
        value: ${{ jobs.deploy.outputs.base_url }}
      api_base_url:
        description: 'Public URL of the deployed API.'
        value: ${{ jobs.deploy.outputs.api_base_url }}
      internal_api_url:
        description: 'In-cluster Service DNS URL of the deployed API. Use for API shards to bypass the Cloudflare edge.'
        value: ${{ jobs.deploy.outputs.internal_api_url }}
      namespace:
        description: 'Kubernetes namespace the env was deployed into / removed from.'
        value: ${{ jobs.deploy.outputs.namespace || jobs.destroy.outputs.namespace }}

  # Manual ad-hoc trigger. Cluster fields default to the dev AKS so the form
  # pre-fills; only env_id (and image_tag for deploy) usually need typing.
  # secrets/outputs are workflow_call-only concepts; manual runs read the same
  # secrets from the repo and don't produce reusable-workflow outputs.
  workflow_dispatch:
    inputs:
      action:
        description: 'Lifecycle action to run against the env.'
        type: choice
        options:
          - deploy
          - destroy
        required: true
        default: deploy
      env_id:
        description: 'Environment identifier (also the namespace name). DNS-safe: lowercase alphanumerics + hyphens, ≤63 chars. Prefix with debug- for investigation envs.'
        type: string
        required: true
      image_tag:
        description: 'Container tag for api/frontend/seeder. Required for deploy (typically a commit SHA); ignored for destroy.'
        type: string
        required: false
        default: ''
      cluster_resource_group:
        description: 'Azure RG containing the AKS cluster.'
        type: string
        required: true
        default: 'rg-bjjeire-dev-sdc-01'
      cluster_name:
        description: 'AKS cluster name.'
        type: string
        required: true
        default: 'aks-bjjeire-dev-sdc-01'
      cluster_domain:
        description: 'Per-cluster DNS suffix. Diagnostics only.'
        type: string
        required: true
        default: 'dev.bjjeire.com'
      root_domain:
        description: 'DNS base for public hostnames. Empty = use cluster_domain (ephemeral hosts nest under the env, e.g. pr-N.dev.bjjeire.com).'
        type: string
        required: false
        default: ''
      chart_ref:
        description: 'OCI Helm chart reference.'
        type: string
        required: false
        default: 'oci://ghcr.io/ianoflynnautomation/bjj-eire'
      chart_version:
        description: 'Chart version constraint.'
        type: string
        required: false
        default: '>=0.1.0'
      ttl:
        description: 'Namespace TTL annotation. Set higher for long investigations.'
        type: string
        required: false
        default: '4h'
      runner_label:
        description: 'Runner label to schedule on.'
        type: string
        required: false
        default: 'gha-runner-scale-set'

permissions:
  contents: read

jobs:
  validate-env-id:
    name: Validate env_id
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check env_id is DNS-safe
        shell: bash
        env:
          ENV_ID: ${{ inputs.env_id }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_ID}" ]; then
            echo "::error title=env_id required::env_id input is empty"
            exit 1
          fi
          # Kubernetes namespace + DNS-1123 label: lowercase alphanumerics and
          # hyphens, must start and end alphanumeric, max 63 chars.
          if ! echo "${ENV_ID}" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'; then
            echo "::error title=Invalid env_id::'${ENV_ID}' must match ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
            exit 1
          fi
          echo "::notice title=env_id valid::${ENV_ID}"

  deploy:
    if: inputs.action == 'deploy'
    name: Deploy ${{ inputs.env_id }}
    needs: validate-env-id
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    container:
      image: mcr.microsoft.com/azure-cli:2.87.0
    outputs:
      base_url: ${{ steps.urls.outputs.base_url }}
      api_base_url: ${{ steps.urls.outputs.api_base_url }}
      internal_api_url: ${{ steps.urls.outputs.internal_api_url }}
      namespace: ${{ steps.urls.outputs.namespace }}
    env:
      ENV_ID: ${{ inputs.env_id }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      CLUSTER_DOMAIN: ${{ inputs.cluster_domain }}
      ROOT_DOMAIN: ${{ inputs.root_domain || inputs.cluster_domain }}
      TTL: ${{ inputs.ttl }}
      NAMESPACE: ${{ inputs.env_id }}
    steps:
      - name: Checkout test repo (templates)
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Azure OIDC login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup kubelogin
        uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: 'v0.1.4'

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Setup helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Get AKS credentials
        shell: bash
        env:
          CLUSTER_RG: ${{ inputs.cluster_resource_group }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "${CLUSTER_RG}" \
            --name "${CLUSTER_NAME}" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Render namespace + secrets + routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rendered
          # Helm renders the bootstrap chart (Namespace + ExternalSecrets +
          # HTTPRoutes). values.schema.json fails the render if env_id is
          # malformed or root_domain/ttl are empty — no silent envsubst gaps.
          helm template bjj-eire-env .github/k8s/env/bootstrap \
            --set-string envId="${ENV_ID}" \
            --set-string rootDomain="${ROOT_DOMAIN}" \
            --set-string ttl="${TTL}" \
            > rendered/manifests.yaml
          echo "::group::rendered/manifests.yaml"
          cat rendered/manifests.yaml
          echo "::endgroup::"
          # Structural gate before touching the cluster (client-side: the
          # namespace doesn't exist yet, so server dry-run isn't usable here).
          kubectl apply --dry-run=client -f rendered/manifests.yaml

      - name: Apply namespace + secrets + routes
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f rendered/manifests.yaml
          # ExternalSecret reconciliation is async; wait for the underlying
          # Secrets to materialise before Helm tries to reference them.
          for secret in bjj-mongodb-root-password bjj-azure-ad-secret ghcr-pull-secret bjj-donation-secret; do
            echo "Waiting for secret ${secret}..."
            for i in $(seq 1 60); do
              if kubectl -n "${NAMESPACE}" get secret "${secret}" >/dev/null 2>&1; then
                echo "  ✓ ${secret} present"
                break
              fi
              if [ "${i}" -eq 60 ]; then
                echo "::error title=Secret never appeared::${secret} in ${NAMESPACE} after 120s"
                kubectl -n "${NAMESPACE}" describe externalsecret "${secret}" || true
                exit 1
              fi
              sleep 2
            done
          done

      - name: Build per-env values overlay
        shell: bash
        run: |
          set -euo pipefail
          # Fail fast if any per-env input is empty (replaces envsubst's silent
          # empty-on-unset behaviour). ENV_ID is also validated upstream.
          : "${ENV_ID:?env_id is required}" "${IMAGE_TAG:?image_tag is required}" "${ROOT_DOMAIN:?root_domain is required}"
          # Only the values that vary per environment. The static values live in
          # .github/k8s/env/values-ephemeral.yaml; Helm deep-merges the two -f.
          cat > rendered/values-dynamic.yaml <<EOF
          bjj-mongodb:
            namespace: ${ENV_ID}
          bjj-api:
            namespace: ${ENV_ID}
            api:
              image:
                tag: "${IMAGE_TAG}"
              env:
                CorsOptions__AllowedOrigins: "https://${ENV_ID}.${ROOT_DOMAIN}"
                OTEL_RESOURCE_ATTRIBUTES__deployment.environment: "${ENV_ID}"
          bjj-frontend:
            namespace: ${ENV_ID}
            frontend:
              image:
                tag: "${IMAGE_TAG}"
              env:
                SERVICES_API_HTTP_0: "http://bjj-api.${ENV_ID}.svc.cluster.local:80"
              waitForApi:
                apiUrl: "http://bjj-api.${ENV_ID}.svc.cluster.local:80/health"
          seeder:
            image:
              tag: "${IMAGE_TAG}"
          EOF
          echo "::group::rendered/values-dynamic.yaml"
          cat rendered/values-dynamic.yaml
          echo "::endgroup::"

      - name: Helm upgrade --install
        shell: bash
        env:
          GH_ACTOR: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || github.token }}
          CHART_REF: ${{ inputs.chart_ref }}
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io \
            --username "${GH_ACTOR}" \
            --password "${GHCR_PASSWORD}"
          helm upgrade --install bjj-eire \
            "${CHART_REF}" \
            --version "${CHART_VERSION}" \
            --namespace "${NAMESPACE}" \
            --values .github/k8s/env/values-ephemeral.yaml \
            --values rendered/values-dynamic.yaml \
            --wait \
            --timeout 10m
          echo "::group::helm status"
          helm status bjj-eire --namespace "${NAMESPACE}"
          echo "::endgroup::"

      - name: Wait for rollout
        shell: bash
        run: |
          set -euo pipefail
          # `helm --wait` covers Deployments but not always sidecars; an
          # explicit rollout check catches istio-proxy injection failures too.
          for dep in bjj-api bjj-frontend; do
            kubectl -n "${NAMESPACE}" rollout status deployment/"${dep}" --timeout=5m
          done

      - name: Verify rolled image tags
        shell: bash
        run: |
          set -euo pipefail
          # The deployment must run exactly the tag this env was asked to
          # deploy — catches Helm silently rolling out a cached/older image.
          # (Replaces the old pod-age heuristic that lived in the test suite's
          # global-setup: this is the actual invariant, checked once, at the
          # layer that owns it.)
          for dep in bjj-api bjj-frontend; do
            image=$(kubectl -n "${NAMESPACE}" get deployment "${dep}" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            case "${image}" in
              *:"${IMAGE_TAG}") echo "  ✓ ${dep} → ${image}";;
              *)
                echo "::error title=Image tag mismatch::${dep} runs ${image}, expected tag ${IMAGE_TAG} — Helm rolled out a stale image"
                exit 1;;
            esac
          done

      - name: Compute URLs
        id: urls
        shell: bash
        run: |
          set -euo pipefail
          # Single-level subdomains under ${ROOT_DOMAIN} so they're covered by
          # the existing Cloudflare Universal SSL *.${ROOT_DOMAIN} cert.
          # Two-level (${ENV_ID}.${CLUSTER_DOMAIN}) would need Advanced
          # Certificate Manager — see naming-convention doc.
          base="https://${ENV_ID}.${ROOT_DOMAIN}"
          api="https://api-${ENV_ID}.${ROOT_DOMAIN}"
          # In-cluster Service DNS for tests running on in-cluster runners.
          # Skips the Cloudflare edge; Istio still enforces the Entra JWT.
          internal_api="http://bjj-api.${NAMESPACE}.svc.cluster.local"
          {
            echo "base_url=${base}"
            echo "api_base_url=${api}"
            echo "internal_api_url=${internal_api}"
            echo "namespace=${NAMESPACE}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Env ready::${base} (api=${api}, internal=${internal_api}, ns=${NAMESPACE})"

      - name: Smoke ping (frontend + api)
        shell: bash
        env:
          BASE_URL: ${{ steps.urls.outputs.base_url }}
          API_HEALTH_URL: ${{ steps.urls.outputs.api_base_url }}/health
        run: |
          set -euo pipefail
          # Hostnames take 30-90s to propagate via external-dns + cert-manager;
          # poll briefly so downstream test jobs don't see a cold 503.
          # python3 (always present in the azure-cli job container) instead of
          # curl, which the azurelinux base does not guarantee.
          for url in "${BASE_URL}" "${API_HEALTH_URL}"; do
            ok=0
            for _ in $(seq 1 60); do
              code=$(python3 -c '
          import ssl, sys, urllib.request
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          try:
              print(urllib.request.urlopen(sys.argv[1], timeout=3, context=ctx).status)
          except Exception:
              print(0)
          ' "${url}")
              case "${code}" in
                2*|3*) echo "  ✓ ${url} → ${code}"; ok=1; break;;
                *) sleep 2;;
              esac
            done
            if [ "${ok}" -ne 1 ]; then
              echo "::warning title=Cold start::${url} did not return 2xx/3xx within 120s — tests may need to retry initial requests"
            fi
          done

      - name: Dump diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::namespace events"
          kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp | tail -50 || true
          echo "::endgroup::"
          echo "::group::pod status"
          kubectl -n "${NAMESPACE}" get pods -o wide || true
          echo "::endgroup::"
          echo "::group::recent pod logs"
          for pod in $(kubectl -n "${NAMESPACE}" get pods -o name 2>/dev/null); do
            echo "--- ${pod} ---"
            kubectl -n "${NAMESPACE}" logs "${pod}" --all-containers --tail=100 || true
          done
          echo "::endgroup::"

  destroy:
    if: inputs.action == 'destroy'
    name: Destroy ${{ inputs.env_id }}
    needs: validate-env-id
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # Same container-job requirement as deploy (kubernetes-mode ARC pool).
    container:
      image: mcr.microsoft.com/azure-cli:2.87.0
    outputs:
      namespace: ${{ steps.del.outputs.namespace }}
    env:
      NAMESPACE: ${{ inputs.env_id }}
    steps:
      - name: Azure OIDC login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup kubelogin
        uses: azure/use-kubelogin@0ce7c36141aa27d4934872cf00b0120804c98a29 # v1.3
        with:
          kubelogin-version: 'v0.1.4'

      - name: Setup kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1

      - name: Setup helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Get AKS credentials
        shell: bash
        env:
          CLUSTER_RG: ${{ inputs.cluster_resource_group }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: |
          set -euo pipefail
          az aks get-credentials \
            --resource-group "${CLUSTER_RG}" \
            --name "${CLUSTER_NAME}" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Delete namespace
        id: del
        shell: bash
        run: |
          set -euo pipefail
          # Refuse to touch any namespace that isn't marked ephemeral. Stops a
          # mis-set env_id from destroying long-lived namespaces (e.g. an
          # accidental env_id=bjjeire-app would otherwise nuke prod).
          if kubectl get namespace "${NAMESPACE}" >/dev/null 2>&1; then
            label=$(kubectl get namespace "${NAMESPACE}" -o jsonpath='{.metadata.labels.bjjeire\.io/ephemeral}' 2>/dev/null || true)
            if [ "${label}" != "true" ]; then
              echo "::error title=Refusing to destroy::namespace ${NAMESPACE} is missing bjjeire.io/ephemeral=true label — refusing to delete"
              exit 1
            fi
            # `helm uninstall` first so chart hooks (eg. seeder Job cleanup) get
            # a chance to run; the namespace delete is the catch-all.
            helm uninstall bjj-eire --namespace "${NAMESPACE}" --ignore-not-found || true
            kubectl delete namespace "${NAMESPACE}" --wait=false
            echo "::notice title=Env destroyed::${NAMESPACE} marked for deletion"
          else
            echo "::notice title=Nothing to destroy::namespace ${NAMESPACE} not present"
          fi
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"
