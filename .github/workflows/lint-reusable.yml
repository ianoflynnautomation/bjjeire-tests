name: Lint reusable workflow

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - 'examples/**'
      - '.yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint + yamllint + zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint + zizmor
        run: pip install --quiet yamllint==1.35.1 zizmor==1.26.1

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .github/workflows/ examples/

      - name: Run zizmor
        run: zizmor --offline --min-severity high .github/workflows/
