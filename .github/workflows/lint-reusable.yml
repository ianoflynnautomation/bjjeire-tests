name: Lint reusable workflow

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - 'examples/**'
      - '.yamllint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: actionlint + zizmor
    permissions:
      contents: read
      checks: write
    uses: ianoflynnautomation/bjjeire-ci-templates/.github/workflows/lint-workflows.yml@main
    with:
      zizmor-args: '--offline --min-severity high'

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yamllint
        run: pip install --quiet yamllint==1.35.1

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .github/workflows/ examples/
