# Reusable workflow: Docker-provisioned Playwright tests.
#
# Docker provisioning and test execution stay in the same workflow because the
# compose stack must live on the same runner that executes the tests.

name: Playwright Tests (Docker)

on:
  workflow_call:
    inputs:
      compose_file:
        description: 'Path (relative to caller checkout) to docker-compose.yml. Ignored when compose_files is set.'
        type: string
        required: false
        default: 'docker-compose.yml'
      compose_files:
        description: 'Newline-separated list of compose files (relative to caller checkout), stacked left-to-right. Takes precedence over compose_file.'
        type: string
        required: false
        default: ''
      compose_pre_up_script:
        description: 'Path (relative to caller checkout) to a bash script run before docker compose up.'
        type: string
        required: false
        default: ''
      compose_health_url:
        description: 'URL polled until 200-OK before tests start.'
        type: string
        required: false
        default: ''
      seed_data:
        description: 'Run docker compose seeder after startup.'
        type: boolean
        required: false
        default: false
      base_url:
        description: 'BASE_URL for tests.'
        type: string
        required: true
      api_base_url:
        description: 'API_URL for tests.'
        type: string
        required: true
      test_tags:
        description: 'Playwright grep filter, e.g. "@smoke|@regression".'
        type: string
        required: false
        default: '@smoke|@regression'
      shard_total:
        description: 'Default number of parallel shards per project (overridable via project_shard_overrides).'
        type: number
        required: false
        default: 6
      project_shard_overrides:
        description: 'JSON object mapping project name to shard count. Projects not listed use shard_total. Example: {"api":3,"webkit-desktop":2}.'
        type: string
        required: false
        default: '{"api":3,"firefox-desktop":4,"webkit-desktop":3,"chromium-wide":3}'
      playwright_projects:
        description: 'JSON array of Playwright project names to run.'
        type: string
        required: false
        default: '["api","chromium-desktop","firefox-desktop","webkit-desktop","chromium-wide","iphone-15","pixel-8"]'
      node_version:
        description: 'Node.js version for setup-node and merge job.'
        type: string
        required: false
        default: '22'
      playwright_image:
        description: 'Container image used for the test runner.'
        type: string
        required: false
        default: 'mcr.microsoft.com/playwright:v1.59.1-noble'
      test_repo:
        description: 'Owner/repo holding the test code.'
        type: string
        required: false
        default: ''
      test_repo_ref:
        description: 'Git ref of the test repo to check out.'
        type: string
        required: false
        default: 'main'
      verify_provider_pacts:
        description: 'When true, verify external consumer Pact contracts against the running API.'
        type: boolean
        required: false
        default: false
      pact_urls:
        description: 'Newline- or comma-separated pact JSON URLs. Used when no Pact Broker is configured.'
        type: string
        required: false
        default: ''
      pact_broker_url:
        description: 'Pact Broker URL for provider verification.'
        type: string
        required: false
        default: ''

    secrets:
      GHCR_TOKEN:
        required: false
      EPHEMERAL_MONGO_URL:
        required: false
      EPHEMERAL_MONGO_DB:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_API_SCOPE:
        required: false
      AZURE_AUTHORITY:
        required: false
      PACT_BROKER_TOKEN:
        required: false

    outputs:
      test_status:
        description: 'success | failure — aggregated result of the matrix test job.'
        value: ${{ jobs.gate.outputs.status }}
      failed_count:
        description: 'Number of failed tests across all shards (0 on green).'
        value: ${{ jobs.merge-reports.outputs.failed_count }}
      report_artifact_name:
        description: 'Name of the merged HTML report artifact.'
        value: ${{ jobs.merge-reports.outputs.report_artifact_name }}

permissions:
  contents: read
  actions: read

jobs:
  setup:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      shard_matrix: ${{ steps.plan.outputs.shard_matrix }}
    steps:
      - id: plan
        shell: bash
        env:
          PROJECTS: ${{ inputs.playwright_projects }}
          OVERRIDES: ${{ inputs.project_shard_overrides }}
          DEFAULT_SHARDS: ${{ inputs.shard_total }}
        run: |
          # Expand projects × per-project shard counts into a flat matrix.
          # Each entry: { name, config, shard, shard_total }.
          matrix=$(jq -nc \
            --argjson projects "${PROJECTS}" \
            --argjson overrides "${OVERRIDES:-{}}" \
            --argjson defaultShards ${DEFAULT_SHARDS} '
            $projects
            | map(. as $p
                | (($overrides[$p]) // $defaultShards) as $total
                | [range(1; $total + 1)] | map({
                    name: $p,
                    config: (if $p == "api" then "playwright.api.config.ts" else "playwright.ui.config.ts" end),
                    shard: .,
                    shard_total: $total
                  })
              )
            | add
          ')
          echo "shard_matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Planned $(echo "${matrix}" | jq 'length') shard jobs"

  build-image:
    name: Build test-runner image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout test repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.test_repo }}
          ref: ${{ inputs.test_repo_ref }}

      - name: Compute image ref
        id: image
        shell: bash
        run: |
          set -euo pipefail
          # Hash content that affects the image. Same hash means same image, reused across commits.
          hash=$(sha256sum Dockerfile package-lock.json package.json | sha256sum | cut -c1-12)
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          ref="ghcr.io/${owner_lc}/bjjeire-playwright:${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "::notice title=Runner image::${ref}"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Check if image already exists
        id: check
        shell: bash
        run: |
          set -eo pipefail
          if docker manifest inspect "${{ steps.image.outputs.ref }}" >/dev/null 2>&1; then
            echo "::notice title=Image cache hit::Skipping build; image already in GHCR"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Image cache miss::Building and pushing runner image"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.image.outputs.ref }}
          push: true
          cache-from: type=gha,scope=playwright-runner
          cache-to: type=gha,scope=playwright-runner,mode=max

  docker-test:
    name: Docker ${{ matrix.shard.name }} ${{ matrix.shard.shard }}/${{ matrix.shard.shard_total }}
    runs-on: ubuntu-latest
    needs: [setup, build-image]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.setup.outputs.shard_matrix) }}
    env:
      CI: 'true'
      APP_ENV: docker
      BASE_URL: ${{ inputs.base_url }}
      API_URL: ${{ inputs.api_base_url }}
      ACCEPT_INVALID_CERTS: 'true'
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      MONGO_URL: ${{ secrets.EPHEMERAL_MONGO_URL }}
      MONGO_DB: ${{ secrets.EPHEMERAL_MONGO_DB }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_API_SCOPE: ${{ secrets.AZURE_API_SCOPE }}
      AZURE_AUTHORITY: ${{ secrets.AZURE_AUTHORITY }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      RUNNER_IMAGE: ${{ needs.build-image.outputs.image_ref }}
    steps:
      - name: Checkout caller repo (compose sources)
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || github.token }}

      - name: Compute compose file args
        id: compose_args
        shell: bash
        run: |
          set -eo pipefail
          args=""
          files_input='${{ inputs.compose_files }}'
          if [ -n "${files_input}" ]; then
            while IFS= read -r line; do
              trimmed="$(echo "$line" | xargs)"
              [ -z "$trimmed" ] && continue
              args="${args} -f ${trimmed}"
            done <<< "${files_input}"
          else
            args="-f ${{ inputs.compose_file }}"
          fi
          args="$(echo "$args" | sed 's/^ *//')"
          echo "COMPOSE_ARGS=${args}" >> "$GITHUB_ENV"
          echo "::notice title=Compose args::${args}"

      - name: Run pre-up script
        if: inputs.compose_pre_up_script != ''
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "${{ inputs.compose_pre_up_script }}"
          "${{ inputs.compose_pre_up_script }}"

      - name: Docker compose up (build + wait for healthy)
        shell: bash
        run: |
          set -eo pipefail
          echo "::group::docker compose up"
          docker compose $COMPOSE_ARGS up -d --build --wait --wait-timeout 300
          echo "::endgroup::"
          echo "::group::docker compose ps"
          docker compose $COMPOSE_ARGS ps
          echo "::endgroup::"

      - name: Run Seed Data
        if: inputs.seed_data == true
        shell: bash
        run: |
          docker compose $COMPOSE_ARGS run --rm seeder

      - name: Wait for health URL
        if: inputs.compose_health_url != ''
        shell: bash
        run: |
          set -eo pipefail
          url="${{ inputs.compose_health_url }}"
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 "$url" >/dev/null 2>&1; then
              echo "::notice title=Health check::OK after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error title=Health check failed::No 200 from $url within 120s"
          echo "::group::compose logs (tail 500)"
          docker compose $COMPOSE_ARGS logs --tail=500 || true
          echo "::endgroup::"
          exit 1

      - name: Checkout test repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.test_repo }}
          ref: ${{ inputs.test_repo_ref }}
          path: tests-checkout

      - name: Pull test-runner image
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::docker pull ${RUNNER_IMAGE}"
          docker pull "${RUNNER_IMAGE}"
          echo "::endgroup::"

      - name: Download OpenAPI contract for API contract checks
        if: matrix.shard.name == 'api'
        shell: bash
        run: |
          curl -fsSL "${API_URL}/openapi/v1.json" -o tests-checkout/openapi-v1.json

      - name: Lint OpenAPI contract
        if: matrix.shard.name == 'api' && matrix.shard.shard == 1
        shell: bash
        run: |
          docker run --rm \
            --network host \
            --ipc host \
            -v "${{ github.workspace }}/tests-checkout/openapi-v1.json:/home/pwuser/app/openapi-v1.json:ro" \
            -e CI=true \
            "${RUNNER_IMAGE}" \
            npm run lint:openapi

      - name: Verify external consumer Pact contracts
        if: inputs.verify_provider_pacts == true && matrix.shard.name == 'api' && matrix.shard.shard == 1
        shell: bash
        env:
          PACT_URLS: ${{ inputs.pact_urls }}
          PACT_BROKER_URL: ${{ inputs.pact_broker_url }}
        run: |
          docker run --rm \
            --network host \
            --ipc host \
            -e CI=true \
            -e API_URL="${API_URL}" \
            -e PACT_URLS="${PACT_URLS}" \
            -e PACT_BROKER_URL="${PACT_BROKER_URL}" \
            -e PACT_BROKER_TOKEN="${PACT_BROKER_TOKEN}" \
            -e PACT_PROVIDER_NAME="BjjEireApi" \
            -e PACT_PUBLISH_VERIFICATION="true" \
            -e GITHUB_SHA="${GITHUB_SHA}" \
            -e GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            "${RUNNER_IMAGE}" \
            npm run test:pact:provider

      - name: Prepare report dirs
        shell: bash
        run: |
          mkdir -p tests-checkout/playwright-report \
                   tests-checkout/test-results \
                   tests-checkout/blob-report \
                   tests-checkout/allure-results

      - name: Run Playwright tests (in container)
        shell: bash
        run: |
          set -eo pipefail
          name='${{ matrix.shard.name }}'
          config='${{ matrix.shard.config }}'
          shard='${{ matrix.shard.shard }}'
          shard_total='${{ matrix.shard.shard_total }}'

          echo "::notice title=Shard::${name} ${shard}/${shard_total} (${config})"

          args=(
            test
            -c "$config"
            --project="$name"
            --shard=${shard}/${shard_total}
          )
          if [ -n "${{ inputs.test_tags }}" ]; then
            args+=(--grep="${{ inputs.test_tags }}")
          fi

          openapi_mount=()
          if [ -f "${{ github.workspace }}/tests-checkout/openapi-v1.json" ]; then
            openapi_mount=(
              -v "${{ github.workspace }}/tests-checkout/openapi-v1.json:/home/pwuser/app/openapi-v1.json:ro"
              -e OPENAPI_CONTRACT_PATH="/home/pwuser/app/openapi-v1.json"
            )
          fi

          echo "::group::playwright test (${name} ${shard}/${shard_total})"
          docker run --rm \
            --network host \
            --ipc host \
            "${openapi_mount[@]}" \
            -v "${{ github.workspace }}/tests-checkout/playwright-report:/home/pwuser/app/playwright-report" \
            -v "${{ github.workspace }}/tests-checkout/test-results:/home/pwuser/app/test-results" \
            -v "${{ github.workspace }}/tests-checkout/blob-report:/home/pwuser/app/blob-report" \
            -v "${{ github.workspace }}/tests-checkout/allure-results:/home/pwuser/app/allure-results" \
            -e CI=true \
            -e APP_ENV="${APP_ENV}" \
            -e BASE_URL="${BASE_URL}" \
            -e API_URL="${API_URL}" \
            -e ACCEPT_INVALID_CERTS="${ACCEPT_INVALID_CERTS}" \
            -e MONGO_URL="${MONGO_URL}" \
            -e MONGO_DB="${MONGO_DB}" \
            -e AZURE_TENANT_ID="${AZURE_TENANT_ID}" \
            -e AZURE_CLIENT_ID="${AZURE_CLIENT_ID}" \
            -e AZURE_CLIENT_SECRET="${AZURE_CLIENT_SECRET}" \
            -e AZURE_API_SCOPE="${AZURE_API_SCOPE}" \
            -e AZURE_AUTHORITY="${AZURE_AUTHORITY}" \
            "${RUNNER_IMAGE}" \
            "${args[@]}"
          echo "::endgroup::"

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard.name }}-shard-${{ matrix.shard.shard }}-docker
          path: tests-checkout/blob-report/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.shard.name }}-shard-${{ matrix.shard.shard }}-docker
          path: tests-checkout/test-results/**/*.zip
          retention-days: 7
          compression-level: 9
          if-no-files-found: ignore

      - name: Dump compose logs on failure
        if: failure()
        shell: bash
        run: |
          echo "::group::docker compose ps"
          docker compose $COMPOSE_ARGS ps || true
          echo "::endgroup::"
          echo "::group::docker compose logs (tail 500)"
          docker compose $COMPOSE_ARGS logs --no-color --tail=500 || true
          echo "::endgroup::"

      - name: Docker compose down
        if: always()
        shell: bash
        run: docker compose $COMPOSE_ARGS down -v --remove-orphans || true

  merge-reports:
    name: Merge reports
    runs-on: ubuntu-latest
    needs: [docker-test]
    if: always()
    permissions:
      contents: read
      checks: write
    outputs:
      failed_count: ${{ steps.summary.outputs.failed_count }}
      flaky_count: ${{ steps.summary.outputs.flaky_count }}
      report_artifact_name: playwright-html-report
    steps:
      - name: Checkout test repo
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.test_repo }}
          ref: ${{ inputs.test_repo_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'npm'

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --ignore-scripts

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blob-reports
        continue-on-error: true

      - name: Merge reports (html + json + junit + github + custom summary + flakiness)
        id: merge
        shell: bash
        run: |
          set -eo pipefail
          if [ -z "$(ls -A all-blob-reports 2>/dev/null)" ]; then
            echo "::warning title=Merge skipped::No blob reports found; nothing to merge"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::group::playwright merge-reports"
          npx playwright merge-reports \
            --reporter "html,json,junit,github,./src/lib/reporters/github-summary-reporter.ts,./src/lib/reporters/flakiness-reporter.ts" \
            ./all-blob-reports
          echo "::endgroup::"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Compute summary
        id: summary
        if: steps.merge.outputs.skipped == 'false'
        shell: bash
        run: |
          set -eo pipefail
          failed=$(jq '[.suites[]?.suites[]?.specs[]? | select(.tests[]?.results[]?.status=="failed")] | length' test-results/results.json 2>/dev/null || echo 0)
          flaky=$(jq '.totals.flaky // 0' test-results/flake-report.json 2>/dev/null || echo 0)
          echo "failed_count=${failed:-0}" >> "$GITHUB_OUTPUT"
          echo "flaky_count=${flaky:-0}" >> "$GITHUB_OUTPUT"
          if [ "${failed:-0}" -gt 0 ]; then
            echo "::error title=Tests failed::${failed} failed, ${flaky} flaky"
          elif [ "${flaky:-0}" -gt 0 ]; then
            echo "::warning title=Flaky tests::${flaky} test(s) passed only after retry"
          else
            echo "::notice title=All tests passed::0 failed, 0 flaky"
          fi

      - name: Upload HTML report
        if: steps.merge.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 30
          compression-level: 9

      - name: Upload JSON results
        if: steps.merge.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-results
          path: test-results/results.json
          retention-days: 30
          compression-level: 9

      - name: Upload JUnit report
        if: steps.merge.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit
          path: test-results/junit.xml
          retention-days: 90
          compression-level: 9
          if-no-files-found: ignore

      - name: Upload flake report
        if: steps.merge.outputs.skipped == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-flake-report
          path: test-results/flake-report.json
          retention-days: 30
          if-no-files-found: ignore

  pr-comment:
    name: PR comment
    runs-on: ubuntu-latest
    needs: [merge-reports, gate]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Posts (or updates in place) a single PR comment per workflow using the
      # native GitHub REST API via actions/github-script. Idempotency comes
      # from a hidden HTML marker in the comment body.
      - name: Upsert PR comment
        uses: actions/github-script@v7
        env:
          STATUS: ${{ needs.gate.outputs.status }}
          FAILED: ${{ needs.merge-reports.outputs.failed_count }}
          FLAKY: ${{ needs.merge-reports.outputs.flaky_count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_NAME: ${{ needs.merge-reports.outputs.report_artifact_name }}
        with:
          script: |
            const marker = '<!-- playwright-docker-report -->';
            const status = process.env.STATUS || 'unknown';
            const failed = process.env.FAILED || '0';
            const flaky = process.env.FLAKY || '0';
            const runUrl = process.env.RUN_URL || '';
            const reportName = process.env.REPORT_NAME || '';
            const label = status === 'success' ? 'PASS' : 'FAIL';

            const body = [
              marker,
              `## Playwright Docker tests: ${label}`,
              '',
              '| Result | Failed | Flaky |',
              '|--------|-------:|------:|',
              `| \`${status}\` | ${failed} | ${flaky} |`,
              '',
              `HTML report artifact: \`${reportName}\` (download from the run page)`,
              `Workflow run: ${runUrl}`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.notice(`Updated PR comment ${existing.id} on #${issue_number}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
              core.notice(`Created PR comment ${created.id} on #${issue_number}`);
            }

  gate:
    name: Result gate
    runs-on: ubuntu-latest
    needs: [docker-test]
    if: always()
    permissions:
      contents: read
    outputs:
      status: ${{ steps.eval.outputs.status }}
    steps:
      - id: eval
        shell: bash
        run: |
          docker_result="${{ needs.docker-test.result }}"
          echo "docker-test=${docker_result}"

          if [ "$docker_result" = "failure" ] || [ "$docker_result" = "cancelled" ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"
